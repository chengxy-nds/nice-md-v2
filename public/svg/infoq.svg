<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="infoq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#004080"/>
    </linearGradient>
    <filter id="infoq-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#002244" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" ry="26" fill="url(#infoq-grad)"/>
  <!-- InfoQ Typography in Pure White with soft shadow -->
  <g filter="url(#infoq-shadow)">
    <text x="50" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-0.5">InfoQ</text>
  </g>
</svg>
