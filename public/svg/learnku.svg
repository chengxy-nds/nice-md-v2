<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c875"/>
      <stop offset="100%" stop-color="#008855"/>
    </linearGradient>
    <filter id="lk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#004422" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" ry="26" fill="url(#lk-grad)"/>
  <!-- LearnKu 'LK' in Pure White -->
  <g filter="url(#lk-shadow)">
    <text x="50" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-1">LK</text>
  </g>
</svg>
